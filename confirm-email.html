
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>E-Mail bestätigen | Beat the Beast</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080a0c;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .logo {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -3px;
      line-height: 1;
    }

    .subtitle {
      margin-top: 8px;
      color: #d9aa47;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .card {
      margin-top: 34px;
      background: #12161b;
      border: 1px solid #292f36;
      border-radius: 22px;
      padding: 30px 25px;
      text-align: left;
    }

    .eyebrow {
      color: #d9aa47;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 27px;
      margin: 15px 0;
      line-height: 1.2;
    }

    p {
      color: #a4a8ae;
      font-size: 15px;
      line-height: 1.7;
    }

    .status {
      margin-top: 24px;
      padding: 16px;
      border-radius: 13px;
      font-size: 14px;
      line-height: 1.6;
      background: #101a15;
      border: 1px solid #335841;
      color: #a9d0b7;
    }

    .status.error {
      background: #241617;
      border-color: #68383c;
      color: #f0b9bd;
    }

    .status.neutral {
      background: #171a1e;
      border-color: #353b42;
      color: #dadde0;
    }

    .footer {
      margin-top: 30px;
      color: #d9aa47;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    a {
      color: #d9aa47;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">BTB</div>
    <div class="subtitle">BEAT THE BEAST</div>

    <section class="card">
      <div class="eyebrow">DEIN ZUGANG / YOUR ACCOUNT</div>

      <h1 id="heading">E-Mail-Bestätigung</h1>

      <p id="description">
        Dein Bestätigungslink wurde geöffnet.
      </p>

      <div id="status" class="status neutral">
        Bitte warte einen Moment.
      </div>

      <p>
        Bei Fragen erreichst du uns über
        <a href="support.html">unseren Support</a>.
      </p>
    </section>

    <div class="footer">ROAD TO BEAST</div>
  </main>

  <script>
    (function () {
      const hash = new URLSearchParams(
        window.location.hash.substring(1)
      );
      const query = new URLSearchParams(
        window.location.search
      );

      const error = hash.get("error") || query.get("error");
      const errorCode =
        hash.get("error_code") || query.get("error_code");

      const hasSuccessfulRedirect =
        Boolean(hash.get("access_token")) ||
        Boolean(query.get("code"));

      const heading = document.getElementById("heading");
      const description =
        document.getElementById("description");
      const status = document.getElementById("status");

      if (error || errorCode) {
        heading.textContent = "Bestätigung fehlgeschlagen";
        description.textContent =
          "Der Bestätigungslink konnte nicht erfolgreich verarbeitet werden.";

        status.className = "status error";

        if (errorCode === "otp_expired") {
          status.textContent =
            "Dieser Link ist ungültig, wurde bereits verwendet oder ist abgelaufen. Prüfe, ob du dich bereits in Beat the Beast anmelden kannst. Andernfalls fordere einen neuen Bestätigungslink an.";
        } else {
          status.textContent =
            "Bitte fordere gegebenenfalls einen neuen Bestätigungslink an oder kontaktiere unseren Support.";
        }
      } else if (hasSuccessfulRedirect) {
        heading.textContent = "E-Mail bestätigt!";
        description.textContent =
          "Deine E-Mail-Adresse wurde bestätigt. " +
          "Du kannst jetzt zu Beat the Beast zurückkehren.";

        status.className = "status";
        status.textContent =
          "Bestätigung erfolgreich! / Email confirmed! " +
          "Öffne die Beat the Beast App und melde dich an.";
      } else {
        heading.textContent = "E-Mail-Bestätigung";
        description.textContent =
          "Wenn du deine E-Mail gerade bestätigt hast, " +
          "öffne jetzt Beat the Beast.";

        status.className = "status neutral";
        status.textContent =
          "Versuche, dich in der App anzumelden. " +
          "Wenn deine E-Mail noch nicht bestätigt ist, " +
          "verwende den aktuellen Bestätigungslink aus deinem Postfach.";
      }

      // Entfernt mögliche Authentifizierungsdaten
      // aus der sichtbaren Browseradresse.
      window.history.replaceState(
        null,
        "",
        window.location.pathname
      );
    })();
  </script>
</body>
</html>
