<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Passwort zurücksetzen | Beat the Beast</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #080a0c; color: #f5f5f5; min-height: 100vh; padding: 36px 16px; display: grid; place-items: center; }
    main { width: min(100%, 440px); }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand .btb { font-size: 48px; font-weight: 900; letter-spacing: -2px; }
    .brand .sub { color: #d7a84b; letter-spacing: 4px; font-size: 12px; font-weight: 800; }
    .card { background: #121519; border: 1px solid #24282d; border-radius: 24px; padding: 26px 22px; }
    .eyebrow { color: #d7a84b; letter-spacing: 2px; font-size: 12px; font-weight: 800; }
    h1 { font-size: 28px; line-height: 1.2; margin: 10px 0 10px; }
    p { color: #adb0b6; font-size: 14px; line-height: 1.6; }
    label { display: block; margin: 18px 0 7px; text-transform: uppercase; font-size: 11px; font-weight: 700; letter-spacing: 1.1px; color: #adb0b6; }
    input { width: 100%; height: 52px; background: #0d0f11; border: 1px solid #34383d; border-radius: 14px; color: #fff; padding: 0 14px; font: inherit; }
    input:focus { outline: 2px solid #d7a84b; outline-offset: 1px; }
    button { width: 100%; height: 54px; border: 0; border-radius: 14px; background: #d7a84b; color: #080a0c; font: inherit; font-size: 14px; font-weight: 900; letter-spacing: 1px; margin-top: 24px; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    .message { margin-top: 18px; padding: 13px; border-radius: 12px; border: 1px solid #34383d; background: #0d0f11; color: #ddd; line-height: 1.5; font-size: 14px; }
    .message.error { border-color: #8f3f3f; color: #ffb8b8; }
    .message.success { border-color: #436d53; color: #b0dbc2; }
    .hidden { display: none; }
    .footer { text-align: center; margin-top: 24px; color: #9d762f; font-weight: 800; letter-spacing: 2px; font-size: 11px; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><div class="btb">BTB</div><div class="sub">BEAT THE BEAST</div></div>
    <section class="card">
      <div class="eyebrow">DEIN ZUGANG / YOUR ACCOUNT</div>
      <h1>Passwort zurücksetzen</h1>
      <p id="intro">Bitte warte, während wir deinen Wiederherstellungslink prüfen.</p>
      <form id="resetForm" class="hidden">
        <label for="password">Neues Passwort / New password</label>
        <input id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="Mindestens 8 Zeichen">
        <label for="confirm">Passwort wiederholen / Confirm password</label>
        <input id="confirm" type="password" required minlength="8" autocomplete="new-password" placeholder="Passwort wiederholen">
        <button id="submit" type="submit">PASSWORT SPEICHERN</button>
      </form>
      <div id="message" class="message hidden" role="status" aria-live="polite"></div>
    </section>
    <div class="footer">ROAD TO BEAST</div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (async () => {
      'use strict';
      // This is the public Supabase publishable key, not a service-role secret.
      const PROJECT_URL = 'https://upmylmmjtlnhbmiqjkgo.supabase.co';
      const PUBLISHABLE_KEY = 'sb_publishable_QnoT3igC9F8u9o8OzBTEjQ_I29BFpbj';
      const form = document.getElementById('resetForm');
      const intro = document.getElementById('intro');
      const message = document.getElementById('message');
      const btn = document.getElementById('submit');
      const originalHash = new URLSearchParams(window.location.hash.slice(1));
      const originalQuery = new URLSearchParams(window.location.search);
      const isRecovery = originalHash.get('type') === 'recovery' || originalQuery.get('type') === 'recovery';
      const authError = originalHash.get('error_description') || originalQuery.get('error_description');
      const show = (text, kind='error') => {
        message.textContent = text;
        message.className = 'message ' + kind;
      };

      if (authError) {
        intro.textContent = 'Der Wiederherstellungslink ist ungültig oder abgelaufen. Bitte fordere in der App einen neuen Link an.';
        show('Link expired or invalid. Request a new link from the app.');
        return;
      }
      if (!isRecovery || !originalHash.get('access_token') || !originalHash.get('refresh_token')) {
        intro.textContent = 'Bitte öffne diese Seite über den aktuellen Passwort-Zurücksetzen-Link aus deiner E-Mail.';
        return;
      }
      if (!window.supabase || !window.supabase.createClient) {
        intro.textContent = 'Die Verbindung konnte nicht geladen werden. Bitte versuche es erneut.';
        return;
      }

      // Use a one-page, non-persistent session only for changing the password.
      const client = window.supabase.createClient(PROJECT_URL, PUBLISHABLE_KEY, {
        auth: { detectSessionInUrl: true, persistSession: false, autoRefreshToken: false, flowType: 'implicit' }
      });
      try {
        const { data, error } = await client.auth.getSession();
        if (error || !data.session) throw new Error('No recovery session');
        const { error: userError } = await client.auth.getUser();
        if (userError) throw userError;
        window.history.replaceState(null, '', window.location.pathname);
        intro.textContent = 'Lege jetzt ein neues Passwort für dein Beat-the-Beast-Konto fest. Verwende mindestens 8 Zeichen.';
        form.classList.remove('hidden');
      } catch {
        intro.textContent = 'Der Wiederherstellungslink konnte nicht bestätigt werden. Fordere in der App bitte einen neuen Link an.';
        return;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const pwd = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;
        if (pwd.length < 8) return show('Das Passwort muss mindestens 8 Zeichen lang sein.');
        if (pwd !== confirm) return show('Die Passwörter stimmen nicht überein.');
        btn.disabled = true;
        try {
          const { error } = await client.auth.updateUser({ password: pwd });
          if (error) throw error;
          form.classList.add('hidden');
          intro.textContent = 'Dein Passwort wurde geändert. Öffne Beat the Beast und melde dich mit deinem neuen Passwort an.';
          show('Password updated successfully. You can now sign in to the app.', 'success');
          document.getElementById('password').value = '';
          document.getElementById('confirm').value = '';
          await client.auth.signOut({ scope: 'local' });
        } catch {
          show('Das Passwort konnte nicht geändert werden. Bitte versuche es erneut oder fordere einen neuen Link an.');
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
